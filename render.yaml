# Render Blueprint: API + PostgreSQL
# https://render.com/docs/blueprint-spec
# 1) Push repo to GitHub
# 2) Render Dashboard → New → Blueprint → connect repo
# 3) After deploy: set PUBLIC_BASE_URL, CORS, OAuth IDs in kraina-api → Environment

databases:
  - name: kraina-db
    databaseName: kraina
    user: kraina
    plan: basic-256mb

services:
  - type: web
    name: kraina-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: kraina-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: LANDMARK_BUNDLE_PUBLIC_GET
        value: "1"
